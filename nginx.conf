server {
    listen 80;
    listen [::]:80;
    server_name www.villafiscardo.com villafiscardo.com;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://villafiscardo.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.villafiscardo.com;
    
    # SSL configuration (your Digital Ocean droplet will have these paths)
    ssl_certificate /etc/letsencrypt/live/villafiscardo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/villafiscardo.com/privkey.pem;
    
    # Redirect www to non-www with HTTPS
    return 301 https://villafiscardo.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name villafiscardo.com;
    
    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/villafiscardo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/villafiscardo.com/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    
    # HSTS (comment this line if you have issues with your website)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Other security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Root directory and index file
    root /var/www/villafiscardo/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Caching static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    
    # Block access to hidden files
    location ~ /\.(?!well-known) {
        deny all;
    }
}